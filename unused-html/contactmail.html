<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interior Calculator</title>

<style>
body {
    font-family: 'Poppins', sans-serif;
    background: #f5f7fb;
}

.container {
    max-width: 500px;
    margin: auto;
    background: #fff;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

.step { display: none; }
.active { display: block; }

.progress {
    display: flex;
    margin-bottom: 20px;
}
.progress div {
    flex: 1;
    height: 5px;
    margin: 3px;
    background: #ddd;
}
.progress .active-bar {
    background: #4CAF50;
}

button {
    padding: 10px 20px;
    border: none;
    background: #4CAF50;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

input, select {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
}
</style>
</head>

<body>

<div class="container">

<div class="progress">
    <div id="bar1" class="active-bar"></div>
    <div id="bar2"></div>
    <div id="bar3"></div>
    <div id="bar4"></div>
</div>

<!-- STEP 1 -->
<div class="step active">
    <h3>Select Property Type</h3>
    <select id="property">
        <option>1 BHK</option>
        <option>2 BHK</option>
        <option>3 BHK</option>
    </select>
    <button onclick="nextStep(1)">Next</button>
</div>

<!-- STEP 2 -->
<div class="step">
    <h3>Select Rooms</h3>
    <input type="number" id="living" placeholder="Living Room" value="1">
    <input type="number" id="kitchen" placeholder="Kitchen" value="1">
    <input type="number" id="bedroom" placeholder="Bedroom" value="1">
    <input type="number" id="bathroom" placeholder="Bathroom" value="1">
    <button onclick="prevStep(2)">Back</button>
    <button onclick="nextStep(2)">Next</button>
</div>

<!-- STEP 3 -->
<div class="step">
    <h3>Your Details</h3>
    <input type="text" id="name" placeholder="Name">
    <input type="email" id="email" placeholder="Email">
    <input type="text" id="phone" placeholder="Phone">
    <button onclick="prevStep(3)">Back</button>
    <button onclick="submitForm()">Get Estimate</button>
</div>

<!-- STEP 4 -->
<div class="step">
    <h3>Your Estimate is Ready 🎉</h3>
    <h2 id="result"></h2>
</div>

</div>

<script>
let steps = document.querySelectorAll(".step");

function showStep(i) {
    steps.forEach(s => s.classList.remove("active"));
    steps[i].classList.add("active");

    document.querySelectorAll(".progress div").forEach(b => b.classList.remove("active-bar"));
    for (let j = 0; j <= i; j++) {
        document.getElementById("bar"+(j+1)).classList.add("active-bar");
    }
}

function nextStep(i){ showStep(i); }
function prevStep(i){ showStep(i-2); }

// CALCULATE + SEND
function submitForm(){

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let phone = document.getElementById("phone").value;

    if(!name || !email || !phone){
        alert("Fill all fields");
        return;
    }

    let total =
        (living.value * 50000) +
        (kitchen.value * 70000) +
        (bedroom.value * 40000) +
        (bathroom.value * 30000);

    document.getElementById("result").innerText = "₹ " + total;

    fetch("YOUR_GOOGLE_SCRIPT_URL", {
        method: "POST",
        body: JSON.stringify({
            name, email, phone, total
        })
    });

    showStep(3);
}
</script>

</body>
</html>
